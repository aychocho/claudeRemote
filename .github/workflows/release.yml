name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=$VERSION" -o claudeRemote ./cmd/claude-remote
          VERSION=$VERSION ARCH=${{ matrix.goarch }} nfpm package --packager deb --target claudeRemote_${VERSION}_${{ matrix.goarch }}.deb

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" claudeRemote_*.deb

  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all .deb files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*.deb"

      - name: Generate checksums
        run: sha256sum *.deb > checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" checksums.txt
